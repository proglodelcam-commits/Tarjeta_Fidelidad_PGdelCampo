<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productos Globales del Campo | Tienda en Línea y Fidelidad</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&display=swap" rel="stylesheet">
<style>
:root {
--primary: #1b382b;
--primary-dark: #10241c;
--accent: #c8963e;
--leaf: #8eb057;
--bg-cream: #f4f4f6;
--bg-warm: #fdfbf7;
--bg-white: #ffffff;
--text-dark: #2c2c2c;
--text-muted: #6b7c68;
--border-color: #e2e8f0;
--radius-lg: 16px;
--radius-md: 12px;
--shadow: 0 4px 20px rgba(27, 56, 43, 0.08);
--transition: all 0.25s ease;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
body { background-color: var(--bg-cream); color: var(--text-dark); line-height: 1.5; padding-bottom: 60px; }
.container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

/* ===== PANTALLA INICIAL DE FIDELIDAD ===== */
.client-stamp-container {
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
padding: 20px;
background-color: var(--bg-cream);
}
.client-stamp-card {
background: linear-gradient(135deg, #1b4d3e 0%, #2c6b56 100%);
color: white;
padding: 30px;
border-radius: 20px;
width: 100%;
max-width: 460px;
box-shadow: 0 12px 30px rgba(0,0,0,0.2);
text-align: center;
}
.client-card-header h3 {
font-family: 'Fraunces', serif;
font-size: 24px;
margin-bottom: 15px;
letter-spacing: 0.02em;
}
.client-search-box {
display: flex;
flex-direction: column;
gap: 14px;
margin-top: 20px;
margin-bottom: 15px;
}
.client-search-box input {
width: 100%;
padding: 14px;
border: none;
border-radius: 10px;
font-size: 16px;
text-align: center;
color: #333;
font-weight: 600;
}
.client-search-box button {
background-color: #ffca28;
border: none;
color: #222;
padding: 14px;
border-radius: 10px;
font-weight: 800;
cursor: pointer;
font-size: 15px;
transition: var(--transition);
box-shadow: 0 4px 10px rgba(255,202,40,0.2);
}
.client-search-box button:hover { background-color: #ffb300; transform: translateY(-1px); }
.client-placeholder { text-align: center; opacity: 0.85; font-size: 13.5px; margin: 10px 0; line-height: 1.4; }

/* Cuadrícula Estética de 10 Sellos */
.stamp-grid-10 {
display: grid;
grid-template-columns: repeat(5, 1fr);
gap: 10px;
margin: 20px 0;
padding: 5px 0;
}
.stamp-slot-10 {
width: 100%;
aspect-ratio: 1;
border-radius: 50%;
background: rgba(255, 255, 255, 0.15);
border: 2px dashed rgba(255,255,255,0.4);
display: flex;
align-items: center;
justify-content: center;
font-size: 20px;
position: relative;
transition: all 0.3s ease;
}
.stamp-slot-10.active {
background: white;
border-style: solid;
border-color: white;
transform: scale(1.08);
box-shadow: 0 4px 10px rgba(0,0,0,0.2);
color: #333;
}
.stamp-number-10 {
font-size: 10px;
position: absolute;
bottom: -18px;
opacity: 0.75;
color: white;
font-weight: 600;
}
.reward-banner-10 {
background-color: #fff3cd;
color: #856404;
padding: 15px;
border-radius: 12px;
text-align: center;
font-weight: bold;
margin: 15px 0;
font-size: 14px;
border: 1px solid #ffeeba;
line-height: 1.4;
}

/* ===== BANNER PRINCIPAL ===== */
.banner { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; padding: 36px 20px 52px; position: relative; overflow: hidden; }
.banner::after { content: ""; position: absolute; right: -60px; top: -60px; width: 260px; height: 260px; background: radial-gradient(circle, rgba(200,150,62,0.25) 0%, transparent 70%); }
.banner-inner { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; position: relative; z-index: 1; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark { width: 46px; height: 46px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
.brand-name { font-family: 'Fraunces', serif; font-size: 21px; font-weight: 800; line-height: 1.15; text-transform: uppercase; letter-spacing: 0.01em; }
.brand-tagline { font-size: 11px; opacity: 0.75; letter-spacing: 0.04em; font-weight: 600; }
.banner-hero { margin-top: 26px; max-width: 640px; position: relative; z-index: 1; }
.banner-hero h1 { font-family: 'Fraunces', serif; font-size: clamp(24px, 4vw, 34px); font-weight: 700; margin-bottom: 8px; }
.banner-hero p { font-size: 13.5px; opacity: 0.85; max-width: 480px; }

/* ===== LAYOUT PRINCIPAL ===== */
.shop-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; margin-top: -26px; padding-bottom: 40px; position: relative; z-index: 2; }
@media (max-width: 900px) { .shop-layout { grid-template-columns: 1fr; margin-top: 10px; } }
.catalog-title { font-size: 1.25rem; font-weight: 700; color: var(--primary); margin-bottom: 16px; display: flex; align-items: center; gap: 10px; background: var(--bg-white); padding: 16px 20px; border-radius: var(--radius-lg); box-shadow: var(--shadow); }
.products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }

.product-card { background: var(--bg-white); border-radius: var(--radius-lg); border: 1px solid rgba(27,56,43,0.08); overflow: hidden; box-shadow: var(--shadow); transition: var(--transition); display: flex; flex-direction: column; }
.product-card:hover { transform: translateY(-4px); box-shadow: 0 8px 26px rgba(27,56,43,0.14); }
.product-image { width: 100%; height: 115px; object-fit: cover; background-color: #eef0ee; }
.product-image-fallback { width: 100%; height: 115px; display: flex; align-items: center; justify-content: center; font-size: 36px; background-color: #eef0ee; color: var(--leaf); }
.product-info { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
.product-name { font-size: 0.9rem; font-weight: 700; margin-bottom: 3px; color: var(--text-dark); }
.product-price { font-size: 1.05rem; font-weight: 700; color: var(--primary); margin-top: auto; margin-bottom: 10px; }
.btn-add { background-color: var(--primary); color: #fff; border: none; padding: 9px; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; width: 100%; transition: var(--transition); display: flex; justify-content: center; align-items: center; gap: 6px; font-size: 12px; }
.btn-add:hover { background-color: var(--primary-dark); }

/* ===== PANEL DE PEDIDO Y RESUMEN ===== */
.cart-panel { background: var(--bg-white); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow); border: 1px solid rgba(27,56,43,0.08); height: fit-content; }
.panel-section-title { font-size: 1.1rem; font-weight: 700; color: var(--primary); margin-bottom: 15px; border-bottom: 2px solid var(--bg-cream); padding-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.internal-stamp-card { background: linear-gradient(135deg, #10241c 0%, #1b382b 100%); color: white; padding: 16px; border-radius: var(--radius-md); margin-bottom: 20px; box-shadow: inset 0 2px 6px rgba(0,0,0,0.2); }
.internal-stamp-card h4 { font-size: 13px; margin-bottom: 8px; letter-spacing: 0.03em; color: var(--accent); text-transform: uppercase; }
.cart-items-container { margin-bottom: 15px; max-height: 280px; overflow-y: auto; }
.cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-color); font-size: 13px; }
.cart-item-details h4 { font-weight: 700; color: var(--text-dark); font-size: 13.5px; }
.cart-item-details p { color: var(--text-muted); font-size: 11px; }
.cart-item-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.btn-remove { background: none; border: none; color: #dc3545; font-size: 11px; font-weight: 600; cursor: pointer; }
.cart-empty { text-align: center; color: var(--text-muted); padding: 20px 0; font-size: 13px; }
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 11.5px; font-weight: 600; margin-bottom: 4px; color: var(--text-dark); }
.form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 13px; outline: none; }
.form-group input:focus, .form-group select:focus { border-color: var(--primary); }
.totals-line { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; }
.totals-line.total { font-size: 16px; font-weight: 800; color: var(--primary); border-top: 2px dashed var(--border-color); padding-top: 10px; margin-top: 10px; }
.discount-label { color: #28a745; font-weight: 600; }
.btn-action { width: 100%; padding: 12px; border: none; border-radius: var(--radius-md); font-weight: 700; font-size: 14px; cursor: pointer; transition: var(--transition); display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 10px; }
.btn-whatsapp { background-color: #25d366; color: white; }
.btn-whatsapp:hover { background-color: #1ebd58; }
.btn-whatsapp:disabled, .btn-recibo:disabled { background-color: #cbd5e1; color: #94a3b8; cursor: not-allowed; }
.btn-recibo { background-color: var(--primary); color: white; }
.btn-recibo:hover { background-color: var(--primary-dark); }

.floating-cart-badge { position: fixed; bottom: 20px; right: 20px; background-color: var(--leaf); color: white; padding: 14px 20px; border-radius: 30px; box-shadow: 0 6px 20px rgba(142,176,87,0.4); display: none; align-items: center; gap: 10px; font-weight: 700; font-size: 14px; cursor: pointer; z-index: 1000; text-decoration: none; transition: var(--transition); }
.floating-cart-badge:hover { transform: scale(1.05); background-color: #7da049; }
